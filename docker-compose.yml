version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aktivateclips-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aktivateclips
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 111605
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
